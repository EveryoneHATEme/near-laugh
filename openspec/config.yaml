schema: spec-driven

context: |
  near-laugh is a purpose-built C++/Vulkan runtime and authoring tool
  for one single-player narrative horror game, not a general-purpose engine.
  Follow AGENTS.md for project constraints.
  Use current main specs as the baseline for the selected change.
  Build and validation procedures are documented in docs/DEVELOPMENT.md.

rules:
  proposal:
    - State one intended outcome, explicit non-goals, and dependencies.
    - Define observable acceptance criteria, including relevant failure cases.
    - Distinguish required scope from possible follow-up work.

  specs:
    - Specify observable behavior and intentional invariants.
    - Include relevant failure, cancellation, and recovery scenarios.
    - Do not freeze incidental implementation details.

  design:
    - Explain affected ownership, lifetime, and module boundaries.
    - State compatibility and migration impact, or explicitly state none.
    - Separate automated, GPU, manual, and performance validation.

  tasks:
    - Give each task a verifiable outcome and a validation method.
    - Identify prerequisites and independently verifiable integration points.
    - Separate implementation work from acceptance that requires a person or hardware.

operations:
  apply:
    guidance:
      - Recheck selected-change prerequisites against the current checkout.
      - Use tasks.md as the implementation checklist; avoid parallel duplicate plans.
      - Record validation evidence and unavailable checks without claiming success.

  archive:
    guidance:
      - Distinguish verified results from explicitly accepted limitations.
      - Report unresolved acceptance conditions before proceeding.
